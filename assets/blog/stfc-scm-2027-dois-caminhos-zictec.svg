<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Dois caminhos regulatórios para a voz numerada</title><desc id="d">A autorização geral de interesse coletivo se desdobra em STFC existente e SCM com numeração pública.</desc><defs>
  <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071831"/><stop offset="1" stop-color="#163c78"/></linearGradient>
  <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff4f05"/><stop offset="1" stop-color="#ff9a32"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071831" flood-opacity=".16"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#7da4d8" stroke-width="1" opacity=".12"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#navy)"/><rect width="1600" height="1000" fill="url(#grid)"/>
<text x="800" y="92" text-anchor="middle" fill="#ff7a1a" font-family="Inter,Arial" font-size="20" font-weight="850" letter-spacing="4">MODELO DE OUTORGA E SERVIÇO</text><text x="800" y="158" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="54" font-weight="900">Dois caminhos para a voz numerada</text>
<g filter="url(#shadow)"><rect x="390" y="210" width="820" height="120" rx="28" fill="#fff"/><text x="800" y="258" text-anchor="middle" fill="#102d61" font-family="Inter,Arial" font-size="22" font-weight="800">AUTORIZAÇÃO PARA EXPLORAÇÃO DE SERVIÇOS</text><text x="800" y="294" text-anchor="middle" fill="#40536f" font-family="Inter,Arial" font-size="24" font-weight="700">DE TELECOMUNICAÇÕES DE INTERESSE COLETIVO</text></g>
<path d="M800 330v70M800 400H430v70M800 400h370v70" fill="none" stroke="#ff6a0d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(115 470)" filter="url(#shadow)"><rect width="630" height="370" rx="30" fill="#102d61" stroke="#5f80ad"/><rect x="35" y="32" width="180" height="46" rx="23" fill="#fff"/><text x="125" y="62" text-anchor="middle" fill="#102d61" font-family="Inter,Arial" font-size="20" font-weight="900">STFC existente</text><text x="35" y="128" fill="#fff" font-family="Inter,Arial" font-size="32" font-weight="900">Continuidade e flexibilidade</text>
<g font-family="Inter,Arial" font-size="21" fill="#dbe7f7"><circle cx="50" cy="183" r="8" fill="#ff6a0d"/><text x="75" y="191">numeração fixa já reconhecida</text><circle cx="50" cy="237" r="8" fill="#ff6a0d"/><text x="75" y="245">modalidades local e longa distância</text><circle cx="50" cy="291" r="8" fill="#ff6a0d"/><text x="75" y="299">processos e acordos consolidados</text><circle cx="50" cy="345" r="8" fill="#ff6a0d"/><text x="75" y="353">ativo estratégico para grupos</text></g></g>
<g transform="translate(855 470)" filter="url(#shadow)"><rect width="630" height="370" rx="30" fill="#fff"/><rect x="35" y="32" width="250" height="46" rx="23" fill="#ff6a0d"/><text x="160" y="62" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="20" font-weight="900">SCM com numeração</text><text x="35" y="128" fill="#102d61" font-family="Inter,Arial" font-size="32" font-weight="900">Nova porta de entrada</text>
<g font-family="Inter,Arial" font-size="21" fill="#40536f"><circle cx="50" cy="183" r="8" fill="#ff6a0d"/><text x="75" y="191">9 dígitos em série iniciada por 6</text><circle cx="50" cy="237" r="8" fill="#ff6a0d"/><text x="75" y="245">portabilidade em base pública</text><circle cx="50" cy="291" r="8" fill="#ff6a0d"/><text x="75" y="299">interconexão e operação próprias</text><circle cx="50" cy="345" r="8" fill="#ff6a0d"/><text x="75" y="353">restrições a definir e homologar</text></g></g>
<path d="M430 840v70h370M1170 840v70H800" fill="none" stroke="#ff6a0d" stroke-width="8" stroke-linecap="round"/><rect x="530" y="884" width="540" height="76" rx="38" fill="#ff6a0d"/><text x="800" y="932" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="24" font-weight="900">OPERAÇÃO DE VOZ RESPONSÁVEL</text></svg>