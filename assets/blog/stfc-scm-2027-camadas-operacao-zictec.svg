<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="t d"><title id="t">Camadas necessárias para operar voz sob SCM</title><desc id="d">Seis camadas operacionais permanecem necessárias: comercial, numeração, rede, bilhetagem, segurança e regulação.</desc><defs>
  <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071831"/><stop offset="1" stop-color="#163c78"/></linearGradient>
  <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff4f05"/><stop offset="1" stop-color="#ff9a32"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071831" flood-opacity=".16"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#7da4d8" stroke-width="1" opacity=".12"/></pattern>
</defs>
<rect width="1600" height="1100" fill="#f5f8fc"/><text x="90" y="100" fill="#ff5a0a" font-family="Inter,Arial" font-size="20" font-weight="850" letter-spacing="4">REALIDADE OPERACIONAL</text><text x="90" y="170" fill="#071831" font-family="Inter,Arial" font-size="55" font-weight="900">Voz sob SCM não elimina a operação</text><text x="90" y="220" fill="#52627a" font-family="Inter,Arial" font-size="24">Muda o enquadramento; a cadeia técnica e de responsabilidade continua.</text>
<path d="M205 315V965" stroke="#ff6a0d" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
<g font-family="Inter,Arial">
<g transform="translate(120 280)"><circle cx="85" cy="65" r="34" fill="#ff6a0d" stroke="#fff" stroke-width="8"/><text x="85" y="74" text-anchor="middle" fill="#fff" font-size="25" font-weight="900">1</text><rect x="150" width="1330" height="130" rx="26" fill="#fff" stroke="#d7e2ef" filter="url(#shadow)"/><text x="195" y="52" fill="#102d61" font-size="27" font-weight="900">Comercial e produto</text><text x="195" y="91" fill="#52627a" font-size="21">oferta, contrato, atendimento, SLA e comunicação clara ao assinante</text></g>
<g transform="translate(120 420)"><circle cx="85" cy="65" r="34" fill="#ff6a0d" stroke="#fff" stroke-width="8"/><text x="85" y="74" text-anchor="middle" fill="#fff" font-size="25" font-weight="900">2</text><rect x="150" width="1330" height="130" rx="26" fill="#eaf2fb" stroke="#c6d7ea"/><text x="195" y="52" fill="#102d61" font-size="27" font-weight="900">Numeração e portabilidade</text><text x="195" y="91" fill="#52627a" font-size="21">alocação, ativação, cadastros, base pública e processos de portabilidade</text></g>
<g transform="translate(120 560)"><circle cx="85" cy="65" r="34" fill="#ff6a0d" stroke="#fff" stroke-width="8"/><text x="85" y="74" text-anchor="middle" fill="#fff" font-size="25" font-weight="900">3</text><rect x="150" width="1330" height="130" rx="26" fill="#102d61"/><text x="195" y="52" fill="#fff" font-size="27" font-weight="900">Rede e interconexão</text><text x="195" y="91" fill="#d9e6f7" font-size="21">SIP/SBC, POI/PPI, trânsito, roteamento, capacidade e continuidade</text></g>
<g transform="translate(120 700)"><circle cx="85" cy="65" r="34" fill="#ff6a0d" stroke="#fff" stroke-width="8"/><text x="85" y="74" text-anchor="middle" fill="#fff" font-size="25" font-weight="900">4</text><rect x="150" width="650" height="130" rx="26" fill="#fff" stroke="#d7e2ef"/><text x="195" y="52" fill="#102d61" font-size="27" font-weight="900">Bilhetagem e evidências</text><text x="195" y="91" fill="#52627a" font-size="19">CDR, conciliação, retenção e auditoria</text><rect x="830" width="650" height="130" rx="26" fill="#fff" stroke="#d7e2ef"/><text x="875" y="52" fill="#102d61" font-size="27" font-weight="900">Segurança e autenticação</text><text x="875" y="91" fill="#52627a" font-size="19">identidade, fraude e chamadas verificadas</text></g>
<g transform="translate(120 840)"><circle cx="85" cy="65" r="34" fill="#ff6a0d" stroke="#fff" stroke-width="8"/><text x="85" y="74" text-anchor="middle" fill="#fff" font-size="25" font-weight="900">5</text><rect x="150" width="1330" height="130" rx="26" fill="#fff3e8" stroke="#ffc997"/><text x="195" y="52" fill="#8c3d00" font-size="27" font-weight="900">Obrigações regulatórias e qualidade</text><text x="195" y="91" fill="#72421c" font-size="21">coletas, indicadores, atendimento, emergência, fiscalização e normas futuras</text></g></g>
<rect x="1030" y="65" width="470" height="74" rx="37" fill="#071831"/><text x="1265" y="112" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="20" font-weight="850">SIMPLIFICAR ≠ DESOBRIGAR</text></svg>