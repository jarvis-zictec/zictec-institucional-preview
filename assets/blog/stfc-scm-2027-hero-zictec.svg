<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">STFC e SCM: dois caminhos regulatórios para a voz</title><desc id="d">Ilustração editorial ZICTEC que conecta a telefonia fixa tradicional a uma rede IP com numeração pública no SCM.</desc><defs>
  <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071831"/><stop offset="1" stop-color="#163c78"/></linearGradient>
  <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff4f05"/><stop offset="1" stop-color="#ff9a32"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071831" flood-opacity=".16"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#7da4d8" stroke-width="1" opacity=".12"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#navy)"/><rect width="1600" height="900" fill="url(#grid)"/>
<circle cx="1430" cy="120" r="310" fill="#1d4c89" opacity=".22"/><circle cx="135" cy="820" r="330" fill="#020b1c" opacity=".38"/>
<g transform="translate(90 78)"><path d="M0 22 17 0h34l17 22-17 22H17Z" fill="none" stroke="#ff650d" stroke-width="8"/><path d="m18 31 18-19 14 11-19 18" fill="none" stroke="#ff650d" stroke-width="7"/><text x="90" y="36" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="3">ZICTEC</text></g>
<text x="96" y="226" fill="#b8cbea" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="750" letter-spacing="5">ANÁLISE REGULATÓRIA E OPERACIONAL</text>
<text x="92" y="332" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="94" font-weight="900">STFC</text>
<text x="345" y="332" fill="#ff6a0d" font-family="Inter,Arial,sans-serif" font-size="94" font-weight="900">×</text>
<text x="435" y="332" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="94" font-weight="900">SCM</text>
<text x="96" y="388" fill="#d9e6f7" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="550">O que muda com a numeração pública em 2027</text>
<!-- legacy card -->
<g transform="translate(95 500)" filter="url(#shadow)"><rect width="485" height="270" rx="30" fill="#10284f" stroke="#5677a5" stroke-opacity=".5"/><rect x="28" y="26" width="112" height="38" rx="19" fill="#edf4fc"/><text x="84" y="52" text-anchor="middle" fill="#102d61" font-family="Inter,Arial" font-size="18" font-weight="850">STFC</text>
<path d="M64 121c0-23 19-42 42-42h94c23 0 42 19 42 42v75c0 22-18 40-40 40H104c-22 0-40-18-40-40Z" fill="#071831" stroke="#dce8f7" stroke-width="4"/><path d="M102 95h100v30H102z" fill="#dce8f7"/><circle cx="152" cy="177" r="37" fill="none" stroke="#ff6a0d" stroke-width="8"/><circle cx="152" cy="177" r="8" fill="#ff6a0d"/>
<text x="260" y="114" fill="#fff" font-family="Inter,Arial" font-size="27" font-weight="800">STFC preservado</text><text x="260" y="160" fill="#eef5ff" font-family="Inter,Arial" font-size="22">numeração conhecida</text><text x="260" y="202" fill="#eef5ff" font-family="Inter,Arial" font-size="22">LDN, LDI e atacado</text></g>
<!-- bridge -->
<path d="M580 635C680 565 720 565 800 635s120 70 220 0" fill="none" stroke="#ff6a0d" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
<g fill="#fff" stroke="#ff6a0d" stroke-width="7"><circle cx="620" cy="612" r="13"/><circle cx="720" cy="590" r="13"/><circle cx="800" cy="635" r="18"/><circle cx="880" cy="680" r="13"/><circle cx="980" cy="657" r="13"/></g>
<text x="800" y="830" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="18" font-weight="800" letter-spacing="3">CONTINUIDADE DA VOZ</text>
<!-- SCM card -->
<g transform="translate(1020 500)" filter="url(#shadow)"><rect width="485" height="270" rx="30" fill="#fff"/><rect x="28" y="26" width="112" height="38" rx="19" fill="#ff6a0d"/><text x="84" y="52" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="18" font-weight="850">SCM</text>
<g transform="translate(54 92)" fill="none" stroke="#102d61" stroke-width="6"><circle cx="95" cy="70" r="17" fill="#ff6a0d" stroke="#ff6a0d"/><circle cx="20" cy="28" r="14"/><circle cx="30" cy="132" r="14"/><circle cx="170" cy="20" r="14"/><circle cx="188" cy="126" r="14"/><path d="M34 36 80 61M41 124l39-39m31-28 45-30m-43 58 62 33"/></g>
<text x="270" y="114" fill="#102d61" font-family="Inter,Arial" font-size="27" font-weight="850">Voz numerada</text><text x="270" y="160" fill="#324b70" font-family="Inter,Arial" font-size="22">9 dígitos, série 6</text><text x="270" y="202" fill="#324b70" font-family="Inter,Arial" font-size="22">portabilidade pública</text></g>
</svg>