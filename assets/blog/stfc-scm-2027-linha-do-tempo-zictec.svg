<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Linha do tempo regulatória de 2025 a 2028</title><desc id="d">Marcos da Resolução 777, da numeração pública no SCM, da portabilidade e da autenticação de chamadas.</desc><defs>
  <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071831"/><stop offset="1" stop-color="#163c78"/></linearGradient>
  <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff4f05"/><stop offset="1" stop-color="#ff9a32"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071831" flood-opacity=".16"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#7da4d8" stroke-width="1" opacity=".12"/></pattern>
</defs>
<rect width="1600" height="900" fill="#f5f8fc"/><rect x="56" y="54" width="1488" height="792" rx="36" fill="#fff" stroke="#d7e2ef" filter="url(#shadow)"/>
<text x="110" y="145" fill="#ff5a0a" font-family="Inter,Arial" font-size="20" font-weight="850" letter-spacing="4">CRONOLOGIA</text><text x="110" y="215" fill="#071831" font-family="Inter,Arial" font-size="54" font-weight="900">Os marcos que reorganizam a telefonia</text><text x="110" y="260" fill="#52627a" font-family="Inter,Arial" font-size="24">Mudanças escalonadas exigem planejamento técnico, regulatório e comercial.</text>
<path d="M165 465H1435" stroke="#cbd9e8" stroke-width="16" stroke-linecap="round"/><path d="M165 465H1030" stroke="#ff6a0d" stroke-width="16" stroke-linecap="round"/>
<g font-family="Inter,Arial">
<g transform="translate(215 0)"><circle cx="0" cy="465" r="32" fill="#ff6a0d" stroke="#fff" stroke-width="10"/><rect x="-145" y="322" width="290" height="92" rx="20" fill="#102d61"/><text x="0" y="360" text-anchor="middle" fill="#fff" font-size="24" font-weight="900">2025</text><text x="0" y="391" text-anchor="middle" fill="#cbdcf1" font-size="20">Resolução nº 777</text><text x="-145" y="548" fill="#071831" font-size="21" font-weight="850">Novo marco geral</text><text x="-145" y="581" fill="#52627a" font-size="20">serviços coletivos</text><text x="-145" y="607" fill="#52627a" font-size="20">e transição regulatória</text></g>
<g transform="translate(605 0)"><circle cx="0" cy="465" r="32" fill="#ff6a0d" stroke="#fff" stroke-width="10"/><rect x="-165" y="308" width="330" height="106" rx="20" fill="#102d61"/><text x="0" y="350" text-anchor="middle" fill="#fff" font-size="24" font-weight="900">01/03/2027</text><text x="0" y="383" text-anchor="middle" fill="#cbdcf1" font-size="20">Virada de modelo</text><text x="-165" y="548" fill="#071831" font-size="21" font-weight="850">SCM recebe numeração</text><text x="-165" y="581" fill="#52627a" font-size="20">9 dígitos, início 6</text><text x="-165" y="607" fill="#52627a" font-size="20">sem novas autorizações STFC</text></g>
<g transform="translate(1015 0)"><circle cx="0" cy="465" r="32" fill="#ff6a0d" stroke="#fff" stroke-width="10"/><rect x="-165" y="308" width="330" height="106" rx="20" fill="#102d61"/><text x="0" y="350" text-anchor="middle" fill="#fff" font-size="24" font-weight="900">01/09/2027</text><text x="0" y="383" text-anchor="middle" fill="#cbdcf1" font-size="20">Portabilidade</text><text x="-165" y="548" fill="#071831" font-size="21" font-weight="850">Base pública ativa</text><text x="-165" y="581" fill="#52627a" font-size="20">procedimentos passam</text><text x="-165" y="607" fill="#52627a" font-size="20">a alcançar o SCM numerado</text></g>
<g transform="translate(1390 0)"><circle cx="0" cy="465" r="32" fill="#102d61" stroke="#fff" stroke-width="10"/><rect x="-145" y="322" width="290" height="92" rx="20" fill="#eaf2fb" stroke="#b9cde5"/><text x="0" y="360" text-anchor="middle" fill="#102d61" font-size="24" font-weight="900">2028</text><text x="0" y="391" text-anchor="middle" fill="#40536f" font-size="20">Transição STFC/SMP</text><text x="-145" y="548" fill="#071831" font-size="21" font-weight="850">Autenticação</text><text x="-145" y="581" fill="#52627a" font-size="20">prazo previsto para</text><text x="-145" y="607" fill="#52627a" font-size="20">prestadoras atuais</text></g></g>
<rect x="110" y="720" width="1380" height="76" rx="18" fill="#fff3e8" stroke="#ffd1aa"/><text x="145" y="767" fill="#8c3d00" font-family="Inter,Arial" font-size="21" font-weight="750">Datas programadas devem ser reconfirmadas nos atos vigentes antes de qualquer implantação.</text></svg>