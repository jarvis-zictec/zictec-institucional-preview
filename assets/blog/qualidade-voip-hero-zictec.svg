<text x="70" y="155" font-family="Inter,Arial" font-size="56" fill="#fff" font-weight="900">Qualidade de chamadas VoIP</text>
<text x="70" y="205" font-family="Inter,Arial" font-size="25" fill="#dbe7ff">Como separar perda, jitter, latência, codec e eco antes de</text>
<text x="70" y="239" font-family="Inter,Arial" font-size="25" fill="#dbe7ff">culpar a rota ou trocar parâmetros no escuro.</text>
