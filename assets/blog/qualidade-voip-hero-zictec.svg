<text x="98" y="404" font-family="Inter,Arial" font-size="18" fill="#b8c8e8">RTP não chega ou chega tarde</text>
<text x="98" y="428" font-family="Inter,Arial" font-size="18" fill="#b8c8e8">demais</text>
