<text x="814" y="374" font-family="Inter,Arial" font-size="24" font-weight="800" fill="#fff">Latência</text>
<text x="778" y="404" font-family="Inter,Arial" font-size="18" fill="#b8c8e8">A conversa fica fora de</text>
<text x="778" y="428" font-family="Inter,Arial" font-size="18" fill="#b8c8e8">sincronia</text>
